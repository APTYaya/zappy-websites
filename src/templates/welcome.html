{% extends "base.html" %}

{% block title %}Zappy{% endblock %}

{% block content %}
<div class="page-heading">
  <p>self-hosted file sharing</p>
  {% if username %}
  <h2>Welcome,<span>{{ username }}</span></h2>
  {% else %}
  <h2>Welcome</h2>
  {% endif %}
</div>

{% if not username %}
<div class="box">
  <label class="label">Access Token</label>
  <form action="/auth" method="post">
    <input type="text" name="token" placeholder="tok_••••••••••••••••" autocomplete="off">
    <button type="submit" class="btn">Enter</button>
  </form>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
</div>
{% endif %}
{% endblock %}
