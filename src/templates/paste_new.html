<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Paste — Zappy</title>
</head>
<body>
    <h1>Zappy Pastebin</h1>

    <form action="/paste" method="post">
        <textarea name="content" placeholder="UwU paste your text here"></textarea>

        <select name="language">
            <option value="plain">Plain Text</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
        </select>

        <input type="number" name="expiration_hours" value="1" min="1">
        
        <input type="password" name="password" placeholder="Password (optional)">
        
        <label>
            <input type="checkbox" name="burn" value="true"> Burn after read
        </label>

        <button type="submit">Create Paste</button>
    </form>
    {% if paste_url %}
    <div>
        <p>Paste created! Share this link:</p>
        <input type="text" value="{{ paste_url }}" readonly>
        <button onclick="copyLink()">Copy</button>
        <script>
        function copyLink() {
            var input = document.querySelector('input[readonly]');
            input.select();
        document.execCommand('copy');
        }
        </script>
    </div>
    {% endif %}
</body>
</html>
